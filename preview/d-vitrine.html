<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OK Timmerwerken — diensten-vitrine (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --vlak:#ffffff; --inkt:#14130f; --zacht:#6b6762; --rand:#e9e7e1;
  --lijn:rgba(20,19,15,.04);
  --f:'Inter',system-ui,-apple-system,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
  --max:1180px; --ease:cubic-bezier(.62,.05,0,1); --bounce:cubic-bezier(.3,1.42,.5,1);
  --morph:cubic-bezier(.7,0,.2,1);
}
html{scroll-behavior:smooth}
body{background:var(--vlak);color:var(--inkt);font-family:var(--f);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
em.serif{font-family:var(--serif);font-style:italic;font-weight:400}

section{position:relative;background:var(--vlak);overflow:hidden}
.kolommen{position:absolute;inset:0;z-index:0;pointer-events:none}
.kolommen::before{content:'';position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:min(var(--max),94vw);background-image:linear-gradient(90deg,var(--lijn) .5px,transparent .5px);
  background-size:calc(100%/4) 100%;border-left:.5px solid var(--lijn);border-right:.5px solid var(--lijn)}
.wrap{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:0 24px}

/* ---------- kop met label + pijl ---------- */
.kop{padding:120px 0 40px;position:relative}
.oog{display:flex;width:fit-content;align-items:center;gap:16px;font-size:12px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--zacht);margin-bottom:clamp(44px,6vw,84px)}
.oog .baan{display:inline-block;width:clamp(56px,9vw,130px);height:1px;background:var(--rand);position:relative;flex:none}
.oog .baan::before{content:'';position:absolute;right:0;top:0;width:1px;height:16px;background:var(--rand)}
.oog .baan::after{content:'';position:absolute;right:-4px;top:15px;width:0;height:0;
  border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-top:7px solid var(--zacht)}
.kop h2{font-size:clamp(36px,6vw,76px);font-weight:700;letter-spacing:-.035em;line-height:1}
.kop h2 .warm{color:#c6702f}
.kop p.lead{margin-top:22px;max-width:52ch;color:var(--zacht);font-weight:300;font-size:17px}

/* lijn die zichzelf tekent tijdens het scrollen (zoals de krul bij edesign) */
.krul{position:absolute;right:-4vw;top:40px;width:min(54vw,680px);height:auto;pointer-events:none;z-index:0}
.krul path{fill:none;stroke:var(--inkt);stroke-width:1.1;stroke-linecap:round;opacity:.55}

/* ---------- dienst-rijen ---------- */
.rij{display:flex;align-items:center;gap:clamp(40px,7vw,110px);padding:clamp(70px,10vw,140px) 0}
.rij:nth-child(even){flex-direction:row-reverse}
.rij .tekst{flex:1 1 0;max-width:430px}
.rij:nth-child(odd) .tekst{text-align:right;margin-left:auto}
.rij:nth-child(odd) .tekst .werk{justify-content:flex-end}
.rij .nr{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--zacht)}
.rij h3{margin-top:14px;font-size:clamp(32px,4vw,50px);font-weight:700;letter-spacing:-.03em;line-height:1.02}
.rij p{margin-top:20px;color:var(--zacht);font-size:15.5px;font-weight:300;line-height:1.7}
.werk{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;list-style:none}
.werk li{font-size:12.5px;font-weight:500;padding:6px 12px;border:1px solid var(--rand);border-radius:999px;color:var(--inkt)}
.pil{display:inline-block;margin-top:30px;border:1px solid var(--inkt);border-radius:999px;padding:11px 22px;
  font-size:13px;font-weight:600;transition:background .3s var(--ease),color .3s var(--ease)}
.pil:hover{background:var(--inkt);color:#fff}

/* ---------- de vitrine: zwevend vierkant met bewegende fotovormen ---------- */
.vitrine-vak{flex:0 0 auto;width:min(46vw,500px);will-change:transform}
.vitrine{position:relative;aspect-ratio:1/1;background:var(--bg);overflow:hidden;
  box-shadow:0 50px 90px -40px rgba(20,19,15,.45),0 18px 36px -24px rgba(20,19,15,.25);
  clip-path:inset(100% 0 0 0);transition:clip-path 1.1s var(--ease)}
.vitrine.in{clip-path:inset(0 0 0 0)}
.vlek{position:absolute;background:var(--vlek);transition:all 1.1s var(--morph)}
.vorm{position:absolute;overflow:hidden;background:#222;transition:all 1.1s var(--morph);
  transform:scale(.6);opacity:0}
.vitrine.in .vorm{transform:scale(1);opacity:1}
.vitrine.in .vorm:nth-of-type(2){transition-delay:.12s}
.vitrine.in .vorm:nth-of-type(3){transition-delay:.24s}
.vorm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .9s ease,transform 6s linear;transform:scale(1.08)}
.vorm img.aan{opacity:1;transform:scale(1)}

/* compositie A: drie cirkels (zoals Bon Appétit, eerste stand) */
.vitrine[data-stand="a"] .v1{left:30%;top:42%;width:54%;height:54%;border-radius:50%}
.vitrine[data-stand="a"] .v2{left:61%;top:7%;width:33%;height:33%;border-radius:50%}
.vitrine[data-stand="a"] .v3{left:8%;top:12%;width:24%;height:24%;border-radius:50%}
.vitrine[data-stand="a"] .vlek{left:-14%;top:56%;width:52%;height:52%;border-radius:50%}
/* compositie B: drie bogen naast elkaar (tweede stand) */
.vitrine[data-stand="b"] .v1{left:34%;top:12%;width:32%;height:64%;border-radius:999px 999px 999px 999px}
.vitrine[data-stand="b"] .v2{left:69%;top:22%;width:26%;height:52%;border-radius:999px 999px 0 0}
.vitrine[data-stand="b"] .v3{left:5%;top:30%;width:26%;height:46%;border-radius:999px 999px 0 0}
.vitrine[data-stand="b"] .vlek{left:60%;top:-20%;width:56%;height:44%;border-radius:0 0 0 999px}
/* compositie C: één groot vlak + twee kleine (derde stand) */
.vitrine[data-stand="c"] .v1{left:9%;top:9%;width:62%;height:62%;border-radius:4px}
.vitrine[data-stand="c"] .v2{left:58%;top:52%;width:34%;height:34%;border-radius:50%}
.vitrine[data-stand="c"] .v3{left:16%;top:76%;width:16%;height:16%;border-radius:50%}
.vitrine[data-stand="c"] .vlek{left:74%;top:-12%;width:40%;height:40%;border-radius:50%}

/* voor/na-variant: twee vormen met een label erop */
.vitrine.voorna .v3{display:none}
.vitrine.voorna[data-stand="a"] .v1{left:8%;top:14%;width:44%;height:72%;border-radius:999px 999px 0 0}
.vitrine.voorna[data-stand="a"] .v2{left:52%;top:14%;width:44%;height:72%;border-radius:999px 999px 0 0}
.vitrine.voorna[data-stand="b"] .v1{left:6%;top:8%;width:58%;height:58%;border-radius:50%}
.vitrine.voorna[data-stand="b"] .v2{left:50%;top:46%;width:46%;height:46%;border-radius:50%}
.vitrine.voorna[data-stand="c"] .v1{left:6%;top:8%;width:58%;height:58%;border-radius:50%}
.vitrine.voorna[data-stand="c"] .v2{left:50%;top:46%;width:46%;height:46%;border-radius:50%}
.vlabel{position:absolute;z-index:3;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:#fff;background:rgba(20,19,15,.55);backdrop-filter:blur(6px);padding:5px 10px;border-radius:999px;
  transition:all 1.1s var(--morph)}
.vitrine[data-stand="a"] .vl1{left:12%;top:80%}.vitrine[data-stand="a"] .vl2{left:56%;top:80%}
.vitrine:not([data-stand="a"]) .vl1{left:9%;top:60%}.vitrine:not([data-stand="a"]) .vl2{left:54%;top:86%}

/* badge: draaiende cirkeltekst met het dienst-icoon */
.badge{position:absolute;z-index:4;width:62px;height:62px;border-radius:50%;background:#14130f;color:#fff;
  display:grid;place-items:center;transition:all 1.1s var(--morph)}
.badge svg.icoon{width:24px;height:24px}
.badge svg.ring{position:absolute;inset:0;width:100%;height:100%;animation:draai 14s linear infinite}
.badge svg.ring text{font-size:8.4px;letter-spacing:.2em;fill:rgba(255,255,255,.75);font-family:var(--f);font-weight:600}
@keyframes draai{to{transform:rotate(360deg)}}
.vitrine[data-stand="a"] .badge{left:80%;top:72%}
.vitrine[data-stand="b"] .badge{left:6%;top:6%}
.vitrine[data-stand="c"] .badge{left:76%;top:20%}

/* pil-label in schreefletter (zoals "Chef-driven dining") */
.tag{position:absolute;z-index:4;font-family:var(--serif);font-style:italic;font-size:19px;
  background:var(--tag);color:#14130f;padding:6px 18px;border-radius:999px;transform:rotate(-4deg);
  transition:all 1.1s var(--morph);white-space:nowrap}
.vitrine[data-stand="a"] .tag{left:6%;top:86%}
.vitrine[data-stand="b"] .tag{left:36%;top:84%;transform:rotate(3deg)}
.vitrine[data-stand="c"] .tag{left:10%;top:84%;transform:rotate(-2deg)}
.vitrine.voorna .tag{left:30%!important;top:4%!important}

@media(max-width:820px){
  .rij,.rij:nth-child(even){flex-direction:column;align-items:stretch;gap:36px;padding:60px 0}
  .vitrine-vak{width:100%}
  .rij .tekst,.rij:nth-child(odd) .tekst{text-align:left;max-width:none;margin:0}
  .rij:nth-child(odd) .tekst .werk{justify-content:flex-start}
  .krul{width:90vw;right:-20vw}
}
@media(prefers-reduced-motion:reduce){
  .vitrine,.vorm,.vlek,.badge,.tag,.vlabel{transition:none!important}
  .badge svg.ring{animation:none}
}
</style>
</head>
<body>

<section id="diensten">
  <div class="kolommen"></div>
  <div class="wrap">
    <div class="kop">
      <svg class="krul" viewBox="0 0 680 520" aria-hidden="true">
        <path id="krulpad" d="M20,40 C120,10 210,60 250,140 C290,220 210,300 140,260 C70,220 160,120 270,150 C380,180 400,330 330,380 C260,430 230,330 330,300 C430,270 560,360 600,470 C615,505 640,515 670,500"/>
      </svg>
      <span class="oog">Diensten<i class="baan"></i></span>
      <h2>Zes vakken. <br>Eén <span class="warm">vaste</span> ploeg.</h2>
      <p class="lead">Van de fundering tot het dakraam. Scroll door het werk — elke dienst laat zien
        wat Ozcan en zijn ploeg opleveren.</p>
    </div>

    <div class="rijen" id="rijen"></div>
  </div>
</section>

<script>
(function(){
  var F='../assets/eigen/web/';
  // Eén bron: de zes diensten. Kleuren: helder maar aards, zoals edesign kleurvlakken gebruikt.
  var diensten=[
    {nr:'01',naam:'Betonvloeren',kop:'Een vlakke, gladde vloer die jaren meegaat.',
     tekst:'Binnen en buiten, van een garage tot een compleet terras — inclusief isolatie, wapening en vloerverwarming. Machinaal gevlinderd tot een strak, dicht oppervlak.',
     werk:['Gevlinderde vloer','Vloerverwarming','Terras in beton','Isolatie & wapening'],
     bg:'#e2ad5b',vlek:'#f1d2a4',tag:'#f6e7cf',label:'machinaal gevlinderd',ring:'BETON · VLOEREN · ',icoon:'troffel',
     fotos:['beton-woonhuis-droog.jpg','beton-vlinderen-machine.jpg','beton-terras-tuinmuur.jpg','beton-woonhuis-nat.jpg','beton-overkapping-nat.jpg']},
    {nr:'02',naam:'Vliering & zolder',kop:'Een hele verdieping erbij.',
     tekst:'Van een donkere, ongebruikte zolder naar een volwaardige kamer: vloer, wanden, isolatie en afwerking door één ploeg.',
     werk:['Vliering plaatsen','Zolder isoleren','Wanden & plafonds','Trapgat'],
     bg:'#9fbf8f',vlek:'#cfe0c4',tag:'#e7f0de',label:'van zolder tot kamer',ring:'ZOLDER · VLIERING · ',icoon:'zolder',
     voorna:true,fotos:['zolder-voor.jpg','zolder-na.jpg']},
    {nr:'03',naam:'Carport & overkapping',kop:'Maatwerk dat uw buitenruimte afmaakt.',
     tekst:'Carports, veranda\'s en overkappingen in hout, op maat ontworpen en afgewerkt tot in de puntjes — inclusief fundering en bestrating.',
     werk:['Carport','Veranda','Overkapping','Lichtkoepel'],
     bg:'#d98563',vlek:'#f0c2ad',tag:'#f8e1d6',label:'op maat in hout',ring:'CARPORT · OVERKAPPING · ',icoon:'carport',
     fotos:['carport-bestrating.jpg','overkapping-zwart.jpg','beton-overkapping-nat.jpg']},
    {nr:'04',naam:'Dakramen (Velux)',kop:'Meer licht, altijd waterdicht.',
     tekst:'Als erkend VELUX montagepartner plaatst OK dakramen vakkundig en waterdicht — inclusief betimmering en afwerking aan de binnenkant.',
     werk:['Velux plaatsen','Vervangen','Binnenafwerking','Lichtkoepels'],
     bg:'#86a9cb',vlek:'#c3d6e8',tag:'#e2ecf5',label:'erkend montagepartner',ring:'VELUX · DAKRAMEN · ',icoon:'dakraam',
     fotos:['../../render/hero-huis.jpg','zolder-na.jpg','overkapping-zwart.jpg'],pos:['72% 22%','50% 50%','50% 30%']},
    {nr:'05',naam:'Timmerwerk & afbouw',kop:'Van ruwbouw tot de laatste lijst.',
     tekst:'Doorbraken, wanden, plafonds, kozijnen en de afwerking die alles af maakt. Van puin naar een woonkamer waar u direct in kunt.',
     werk:['Doorbraken','Wanden & plafonds','Kozijnen','Afwerking'],
     bg:'#c9b79c',vlek:'#e6dccb',tag:'#f3ede3',label:'van puin naar thuis',ring:'TIMMERWERK · AFBOUW · ',icoon:'hamer',
     voorna:true,fotos:['doorbraak-sloop.jpg','woonkamer-verbouwing.jpg']},
    {nr:'06',naam:'Funderingen',kop:'Het fundament onder al het werk.',
     tekst:'Funderingen en vloerconstructies — ook bij grote verbouwingen met stalen balken. Degelijk voorbereid, zodat alles erboven goed staat.',
     werk:['Funderingen','Vloerconstructies','Stalen balken','Grondwerk'],
     bg:'#5d6670',vlek:'#8c96a0',tag:'#e5e8eb',label:'degelijk voorbereid',ring:'FUNDERING · CONSTRUCTIE · ',icoon:'fundering',
     fotos:['vloer-staalbalken-ploeg.jpg','beton-woonhuis-nat.jpg','doorbraak-sloop.jpg']}
  ];
  var iconen={
    troffel:'<path d="M4 20l7-7M11 13l6-6 3 3-6 6zM14 4l6 6"/>',
    zolder:'<path d="M3 20h18M5 20V10l7-6 7 6v10M9 20v-5h6v5M9 12h6"/>',
    carport:'<path d="M3 8h18M5 8v12M19 8v12M3 8l2-3h14l2 3M8 16h8l1 3H7z"/>',
    dakraam:'<path d="M3 13l9-8 9 8M8 9.5l4-3 4 3V14H8z M12 6.5V14"/>',
    hamer:'<path d="M14 4l6 6-3 3-6-6zM11 7l-8 8 3 3 8-8"/>',
    fundering:'<path d="M3 9h18M3 9v4h18V9M6 13v7M12 13v7M18 13v7M3 20h18"/>'
  };
  var host=document.getElementById('rijen');
  diensten.forEach(function(d,i){
    var n=d.voorna?2:3;
    var vormen='';
    for(var k=0;k<n;k++){
      vormen+='<div class="vorm v'+(k+1)+'"></div>';
    }
    var rij=document.createElement('article'); rij.className='rij';
    rij.innerHTML=
      '<div class="vitrine-vak"><div class="vitrine'+(d.voorna?' voorna':'')+'" data-stand="a" style="--bg:'+d.bg+';--vlek:'+d.vlek+';--tag:'+d.tag+'">'+
        '<div class="vlek"></div>'+vormen+
        (d.voorna?'<span class="vlabel vl1">Voor</span><span class="vlabel vl2">Na</span>':'')+
        '<div class="badge"><svg class="ring" viewBox="0 0 62 62"><defs><path id="r'+i+'" d="M31,31 m-23,0 a23,23 0 1,1 46,0 a23,23 0 1,1 -46,0"/></defs><text><textPath href="#r'+i+'">'+d.ring+d.ring+'</textPath></text></svg>'+
          '<svg class="icoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+iconen[d.icoon]+'</svg></div>'+
        '<span class="tag">'+d.label+'</span>'+
      '</div></div>'+
      '<div class="tekst"><span class="nr">'+d.nr+' — '+d.naam+'</span><h3>'+d.kop+'</h3><p>'+d.tekst+'</p>'+
        '<ul class="werk">'+d.werk.map(function(w){return '<li>'+w+'</li>';}).join('')+'</ul>'+
        '<a class="pil" href="#">Vraag advies over '+d.naam.split(' ')[0].toLowerCase()+'</a></div>';
    host.appendChild(rij);

    // foto's in de vormen; elke vorm krijgt alle foto's, met een eigen startpunt
    var vs=rij.querySelectorAll('.vorm');
    vs.forEach(function(v,k){
      d.fotos.forEach(function(f,j){
        var img=new Image(); img.src=F+f; img.alt=d.naam; img.loading='lazy';
        if(d.pos&&d.pos[j]) img.style.objectPosition=d.pos[j];
        if(j===k%d.fotos.length) img.className='aan';
        v.appendChild(img);
      });
    });
  });

  var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var vitrines=[].slice.call(document.querySelectorAll('.vitrine'));

  // 1. onthullen als de vitrine in beeld komt
  var io=new IntersectionObserver(function(es){
    // we observeren het (niet-geclipte) vak eromheen: een volledig weggeclipte vitrine telt anders niet als zichtbaar
    es.forEach(function(e){ var v=e.target.firstElementChild;
      if(e.isIntersecting){ v.classList.add('in'); v._zicht=true; } else v._zicht=false; });
  },{threshold:.2});
  vitrines.forEach(function(v){ io.observe(v.parentElement); });

  // 2. vormen morphen tussen drie composities en foto's wisselen (alleen als in beeld)
  var standen=['a','b','c'];
  if(!rm) vitrines.forEach(function(v,i){
    var s=0, vs=v.querySelectorAll('.vorm');
    setTimeout(function(){
      setInterval(function(){
        if(!v._zicht) return;
        s=(s+1)%3;
        if(v.classList.contains('voorna')){ v.dataset.stand = s===0?'a':'b'; return; }
        v.dataset.stand=standen[s];
        vs.forEach(function(vorm){
          var imgs=vorm.querySelectorAll('img'), cur=[].findIndex.call(imgs,function(x){return x.classList.contains('aan');});
          imgs[cur].classList.remove('aan'); imgs[(cur+1)%imgs.length].classList.add('aan');
        });
      },3400);
    }, i*500);
  });

  // 3. parallax: de vitrine schuift iets trager dan de tekst
  var vakken=[].slice.call(document.querySelectorAll('.vitrine-vak'));
  var krul=document.getElementById('krulpad'), krulLen=krul.getTotalLength();
  krul.style.strokeDasharray=krulLen; krul.style.strokeDashoffset=krulLen;
  var tik=false, krulMax=0;
  function scroll(){
    tik=false; var h=innerHeight;
    if(!rm) vakken.forEach(function(vk){
      var r=vk.getBoundingClientRect(), mid=r.top+r.height/2-h/2;
      vk.style.transform='translateY('+(mid*-.12).toFixed(1)+'px)';
    });
    // 4. de krul tekent zich mee met het scrollen door de kop
    var kr=krul.ownerSVGElement.getBoundingClientRect();
    // alleen vooruit: eenmaal getekend blijft de lijn staan, ook als je terug scrolt
    var p=Math.min(1,Math.max(0,(h*.85-kr.top)/(kr.height*.9)));
    krulMax=Math.max(krulMax,rm?1:p);
    krul.style.strokeDashoffset=(krulLen*(1-krulMax)).toFixed(1);
  }
  addEventListener('scroll',function(){ if(!tik){ tik=true; requestAnimationFrame(scroll);} },{passive:true});
  addEventListener('resize',scroll); scroll();
})();
</script>
</body>
</html>
